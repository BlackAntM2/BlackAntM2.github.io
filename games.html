<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANTTECH games</title>
<meta name="description" content="Games by ANTTECH: Dockside: Cast Off and Tap Against Time, free on iPhone.">
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #f4f6f8; color: #14384a; }
  main { max-width: 30rem; margin: 0 auto; padding: 2.5rem 1.25rem 3rem; }
  h1 { font-size: 1.6rem; margin: 0 0 .25rem; letter-spacing: .04em; }
  .sub { color: #5c6b74; margin: 0 0 2rem; }
  a.game { display: flex; gap: 1rem; align-items: center; text-decoration: none; color: inherit;
           background: #fff; border-radius: 16px; padding: 1rem; margin-bottom: 1rem;
           box-shadow: 0 1px 3px rgba(20,56,74,.12); }
  a.game:active { transform: scale(.99); }
  .icon { width: 64px; height: 64px; border-radius: 14px; flex: none; }
  .name { font-weight: 700; font-size: 1.1rem; }
  .tag { color: #5c6b74; font-size: .92rem; }
  .cta { margin-left: auto; background: #fa7054; color: #fff; font-weight: 700;
         padding: .45rem .9rem; border-radius: 999px; font-size: .9rem; white-space: nowrap; }
  footer { text-align: center; color: #8a979e; font-size: .85rem; margin-top: 2rem; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>ANTTECH</h1>
  <p class="sub">Small games, made by one person. All free on iPhone.</p>

  <a class="game" href="https://apps.apple.com/app/id6827859226">
    <div class="icon" style="background:#6bcce8;display:grid;place-items:center">
      <div style="width:38px;height:16px;border-radius:8px 14px 14px 8px;background:#dc2e29"></div>
    </div>
    <div><div class="name">Dockside: Cast Off</div><div class="tag">Slide the boats, free the red one</div></div>
    <span class="cta">Get</span>
  </a>

  <a class="game" href="https://apps.apple.com/app/id6755980854">
    <div class="icon" style="background:#1a1036;display:grid;place-items:center">
      <div style="width:30px;height:30px;border-radius:50%;border:5px solid #35e0d0"></div>
    </div>
    <div><div class="name">Tap Against Time</div><div class="tag">Tap fast. It only gets faster.</div></div>
    <span class="cta">Get</span>
  </a>

  <footer><a href="privacy.html">Privacy</a></footer>
</main>
</body>
</html>
